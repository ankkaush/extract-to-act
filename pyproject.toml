[project]
name = "extract-to-act"
version = "0.1.0"
description = "AI-assisted invoice-to-AP-decision automation pipeline."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "python-multipart>=0.0.9",
    # Phase 6 — the selected ExtractionProvider (docs/adr/0006-extraction-provider.md).
    # Version floor matches what app/extraction.py was actually verified
    # against in the Phase 5 spike (mistralai.client.Mistral, not
    # mistralai.Mistral, and schema_definition not schema).
    "mistralai>=2.9,<3.0",
    # Phase 8 — deterministic fuzzy vendor-name matching. Plain Python
    # string similarity, not AI: see app/vendor_matching.py's docstring
    # for why. Chosen over Postgres's pg_trgm to avoid a CREATE EXTENSION
    # migration for what's currently a small, in-memory vendor list.
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "pre-commit>=3.8",
]
# Phase 5 spike only — deliberately not a dependency of the application
# itself (mistralai moved to the core dependencies above in Phase 6, once
# it became a real production integration, not just an evaluation
# candidate). See spike/README.md, "Why not part of the application".
spike = [
    "azure-ai-documentintelligence>=1.0",
    # Floor raised to the version spike/providers/claude_provider.py was
    # verified against (1.0.0) via static introspection of the response
    # types and method signature — see spike/test_provider_readiness.py.
    "anthropic>=1.0,<2.0",
    "reportlab>=4.2",
    "pillow>=10.4",
    "pymupdf>=1.24",
    "pypdf>=4.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
markers = [
    "real_api: hits a real, billed provider API. Excluded by default — see docs/testing-strategy.md.",
]
addopts = "-m 'not real_api'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 flags `Depends(...)` in a default argument, which is FastAPI's own
# idiomatic dependency-injection pattern, not a bug — it recurs in every
# route, so it's disabled project-wide rather than per-line-ignored.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerates these — reformatting generated migrations to
# satisfy lint rules would fight the tool every time a new one is created.
"alembic/versions/*" = ["E501", "UP"]
# The `notes` field on each InvoiceSpec is long-form prose explaining what
# that document tests (see spike/README.md) — wrapping it to 100 columns
# repeatedly would hurt readability of the sentences themselves for no
# real benefit, unlike E501 in actual code.
"spike/invoice_specs.py" = ["E501"]
