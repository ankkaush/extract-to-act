# Render Blueprint — see docs/deployment.md for the full deploy walkthrough
# and docs/adr/0004-containerization.md / docs/adr/0005-deployment-platform.md
# for why Docker-on-Render, not something else.
#
# Deliberately does NOT include a worker/cron service for app/worker.py —
# that's not on Render's free tier, and isn't required for Phase 17's
# stated completion criterion (a document reaching a terminal state
# through the synchronous upload path alone, no worker involved). See
# docs/adr/0003-worker-model.md and docs/deployment.md's "Known gaps in
# this deployment" section. Revisit if/when continuous crash recovery in
# production is actually needed, not preemptively.

databases:
  - name: extract-to-act-db
    plan: free
    postgresMajorVersion: "17"

services:
  - type: web
    name: extract-to-act
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # Overrides the Dockerfile's CMD: runs pending migrations before
    # every deploy (docs/deployment.md), and binds to Render's dynamic
    # $PORT rather than the hardcoded 8000 docker-compose uses locally.
    dockerCommand: >-
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: extract-to-act-db
          property: connectionString
      - key: APP_ENV
        value: production
      # Secrets — Render prompts for these once, during Blueprint
      # creation, then they live only in Render's own dashboard, never
      # in this file or the repository. See docs/security.md.
      - key: APP_SECRET_KEY
        sync: false
      - key: API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      # Everything below has a safe, documented default in
      # app/config.py — listed here so they're visible and overridable
      # from Render's dashboard without editing this file.
      - key: STORAGE_LOCAL_DIR
        value: /app/data/uploads
      - key: MAX_UPLOAD_SIZE_BYTES
        value: "20971520"
      - key: APPROVAL_THRESHOLD_AMOUNT
        value: "1000.00"
      - key: RETRY_ATTEMPTS
        value: "3"
      - key: NOTIFICATION_RETRY_ATTEMPTS
        value: "2"
      - key: WORKER_STUCK_TIMEOUT_SECONDS
        value: "300"
      - key: WORKER_MAX_RETRIES
        value: "3"
      - key: ESTIMATED_MANUAL_MINUTES_PER_DOCUMENT
        value: "8.0"
